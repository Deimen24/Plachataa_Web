# nginx on the reverse-proxy machine. Replace GAMING_PC with the LAN IP
# or hostname of the PC running Plachataa Web (port 7870 by default).
#
# Two layouts are shown: a dedicated hostname and a sub-path. Use one.

upstream plachataa {
	server GAMING_PC:7870;
}

# --- layout A: own hostname ---------------------------------------------
server {
	listen 443 ssl http2;
	server_name voice.example.com;
	# ssl_certificate / ssl_certificate_key ... (or let certbot manage)

	client_max_body_size 200m;          # matches PLACHATAA_MAX_UPLOAD_MB
	proxy_read_timeout 600s;
	proxy_send_timeout 600s;

	# Optional: authenticate here instead of PLACHATAA_BASIC_AUTH.
	# auth_basic "Voice";
	# auth_basic_user_file /etc/nginx/htpasswd;

	location / {
		proxy_pass http://plachataa;
		proxy_http_version 1.1;
		proxy_set_header Host $host;
		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto $scheme;
		# real-time voice conversion uses a WebSocket
		proxy_set_header Upgrade $http_upgrade;
		proxy_set_header Connection "upgrade";
		proxy_buffering off;
	}
}

# --- layout B: sub-path on an existing site -----------------------------
# Set PLACHATAA_ROOT_PATH=/voice in the .env on the gaming PC.
# The trailing slashes on both location and proxy_pass are required:
# they strip the prefix before forwarding.
